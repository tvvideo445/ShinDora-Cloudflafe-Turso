name = "shindora-stream-d1"
main = "cloudflare-worker-d1.js"
compatibility_date = "2026-01-01"

# BINDING CLOUDFLARE D1 SQL DATABASE
[[d1_databases]]
binding = "DB"
database_name = "shindora-db"
database_id = "shindora-db-id"

# Cron Trigger 24 Jam untuk Auto Token Refresh
[triggers]
crons = ["0 0 * * *"]
